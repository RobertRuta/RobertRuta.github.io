name: Refresh ski trip flight prices

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ski-flight-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh Duffel flight offer prices
        id: refresh
        env:
          DUFFEL_ACCESS_TOKEN: ${{ secrets.DUFFEL_ACCESS_TOKEN }}
        run: node scripts/update-ski-prices.mjs

      - name: Commit updated price database
        if: ${{ always() && steps.refresh.outcome != 'skipped' }}
        run: |
          if git diff --quiet -- public/ski-holiday-2026/prices.json; then
            echo "No price database changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/ski-holiday-2026/prices.json
          git commit -m "Refresh weekly ski trip price data"
          git push
